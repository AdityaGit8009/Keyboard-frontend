<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Keyboard layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Keyboard layout</h1>
        <div class="keyboard-viewport" role="region" aria-label="Keyboard layout" tabindex="0">
            <div class="container">
        <div class="row one">
            <button type="button" data-code="Backquote" aria-label="Grave accent or tilde">~</button>
            <button type="button" data-code="Digit1">1</button>
            <button type="button" data-code="Digit2">2</button>
            <button type="button" data-code="Digit3">3</button>
            <button type="button" data-code="Digit4">4</button>
            <button type="button" data-code="Digit5">5</button>
            <button type="button" data-code="Digit6">6</button>
            <button type="button" data-code="Digit7">7</button>
            <button type="button" data-code="Digit8">8</button>
            <button type="button" data-code="Digit9">9</button>
            <button type="button" data-code="Digit0">0</button>
            <button type="button" data-code="Minus" aria-label="Minus">-</button>
            <button type="button" data-code="Equal" aria-label="Equal sign">=</button>
            <button type="button" data-code="Backspace" class="back">Backspace</button>
        </div>
        <div class="row two">
            <button type="button" data-code="Tab" class="tab">Tab</button>
            <button type="button" data-code="KeyQ">Q</button>
            <button type="button" data-code="KeyW">W</button>
            <button type="button" data-code="KeyE">E</button>
            <button type="button" data-code="KeyR">R</button>
            <button type="button" data-code="KeyT">T</button>
            <button type="button" data-code="KeyY">Y</button>
            <button type="button" data-code="KeyU">U</button>
            <button type="button" data-code="KeyI">I</button>
            <button type="button" data-code="KeyO">O</button>
            <button type="button" data-code="KeyP">P</button>
            <button type="button" data-code="BracketLeft" aria-label="Left square bracket">[</button>
            <button type="button" data-code="BracketRight" aria-label="Right square bracket">]</button>
            <button type="button" data-code="Backslash" aria-label="Backslash" class="slash">\</button>
        </div>
        <div class="row three">
            <button type="button" data-code="CapsLock" class="cap" aria-label="Caps Lock">Caps</button>
            <button type="button" data-code="KeyA">A</button>
            <button type="button" data-code="KeyS">S</button>
            <button type="button" data-code="KeyD">D</button>
            <button type="button" data-code="KeyF">F</button>
            <button type="button" data-code="KeyG">G</button>
            <button type="button" data-code="KeyH">H</button>
            <button type="button" data-code="KeyJ">J</button>
            <button type="button" data-code="KeyK">K</button>
            <button type="button" data-code="KeyL">L</button>
            <button type="button" data-code="Semicolon" aria-label="Semicolon">;</button>
            <button type="button" data-code="Quote" aria-label="Apostrophe">'</button>
            <button type="button" data-code="Enter" class="enter">Enter</button>
        </div>
        <div class="row four">
            <button type="button" data-code="ShiftLeft" aria-label="Left Shift" class="shift">Shift</button>
            <button type="button" data-code="KeyZ">Z</button>
            <button type="button" data-code="KeyX">X</button>
            <button type="button" data-code="KeyC">C</button>
            <button type="button" data-code="KeyV">V</button>
            <button type="button" data-code="KeyB">B</button>
            <button type="button" data-code="KeyN">N</button>
            <button type="button" data-code="KeyM">M</button>
            <button type="button" data-code="Comma" aria-label="Comma">,</button>
            <button type="button" data-code="Period" aria-label="Period">.</button>
            <button type="button" data-code="Slash" aria-label="Slash">/</button>
            <button type="button" data-code="ShiftRight" aria-label="Right Shift" class="shift">Shift</button>
        </div>
        <div class="row five">
            <button type="button" data-code="ControlLeft" aria-label="Left Control" class="same">Ctrl</button>
            <button type="button" data-code="MetaLeft" aria-label="Left Windows or Command key" class="same">Win</button>
            <button type="button" data-code="AltLeft" aria-label="Left Alt" class="same">Alt</button>
            <button type="button" data-code="Space" class="space">Space</button>
            <button type="button" data-code="AltRight" aria-label="Right Alt" class="same">Alt</button>
            <button type="button" data-code="MetaRight" aria-label="Right Windows or Command key" class="same">Win</button>
            <button type="button" data-code="ControlRight" aria-label="Right Control" class="same">Ctrl</button>
        </div>

            </div>
        </div>
    </main>
</body>
</html>
